<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Hojaldras La Ordaz">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b2e1e"/>
      <stop offset="1" stop-color="#2e1a10"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d69a"/>
      <stop offset="0.55" stop-color="#d9ac58"/>
      <stop offset="1" stop-color="#b17f2b"/>
    </linearGradient>
    <linearGradient id="hojaldre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e4bd"/>
      <stop offset="1" stop-color="#d8a94f"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="57" fill="url(#fondo)"/>
  <circle cx="60" cy="60" r="52.5" fill="none" stroke="url(#oro)" stroke-width="2.2"/>
  <circle cx="60" cy="60" r="47" fill="none" stroke="#c8963e" stroke-opacity=".35" stroke-width="1"/>

  <!-- Hojaldre de tres capas -->
  <path d="M28 72c6-17 17-27 32-27s26 10 32 27c-9-6-19-9-32-9s-23 3-32 9z" fill="url(#hojaldre)"/>
  <path d="M33 80c6-13 15-20 27-20s21 7 27 20c-8-4-17-6-27-6s-19 2-27 6z" fill="#e3bb70"/>
  <path d="M39 88c5-9 12-14 21-14s16 5 21 14c-6-3-13-4-21-4s-15 1-21 4z" fill="#c8963e"/>

  <!-- Vapor -->
  <path d="M49 32c-4-5 4-8 0-13M60 29c-4-5 4-8 0-13M71 32c-4-5 4-8 0-13"
        fill="none" stroke="#f0d69a" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>

  <!-- Trigo -->
  <g stroke="url(#oro)" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M86 43c2 10 0 18-6 25"/>
    <path d="M84 49c-5-1-7-4-8-8 4 0 7 3 8 8z" fill="#d9ac58" stroke="none"/>
    <path d="M83 55c-5-1-7-4-8-8 4 0 7 3 8 8z" fill="#d9ac58" stroke="none"/>
    <path d="M81 61c-5-1-7-4-8-8 4 0 7 3 8 8z" fill="#d9ac58" stroke="none"/>
    <path d="M86 47c5 0 8-3 9-7-4 0-7 3-9 7z" fill="#d9ac58" stroke="none"/>
    <path d="M85 53c5 0 8-3 9-7-4 0-7 3-9 7z" fill="#d9ac58" stroke="none"/>
  </g>

  <!-- Base -->
  <path d="M30 95h60" stroke="#c8963e" stroke-width="2" stroke-linecap="round" opacity=".7"/>
